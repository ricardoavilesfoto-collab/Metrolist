# Compilación de Metrolist Plus (fork de Ricardo).
# Archivo exclusivo del fork: el original no lo tiene, así que nunca choca al sincronizar.
# Se instala junto a Metrolist oficial gracias a su propio applicationId.

name: Metrolist Plus

on:
  workflow_dispatch:
  push:
    branches: ["ricardo"]
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - "fastlane/**"
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: metrolist-plus

jobs:
  build:
    name: Compilar y publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleGmsRelease --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.plus
          METROLIST_APP_NAME: Metrolist Plus
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Sign APK
        # Fijada a un commit exacto (v2.0.0): esta acción recibe la llave de firma.
        uses: ilharp/sign-android-release@13dd52242698526f951aa8bb8696204f6fea702a
        with:
          releaseDir: app/build/outputs/apk/gms/release/
          signingKey: ${{ secrets.PLUS_KEYSTORE }}
          keyAlias: ${{ secrets.PLUS_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.PLUS_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.PLUS_KEYSTORE_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Prepare APK
        run: |
          mkdir -p out
          find app/build/outputs/apk/gms/release -name "*-signed.apk" | head -n 1 | xargs -I{} cp {} out/MetrolistPlus.apk
          test -s out/MetrolistPlus.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MetrolistPlus
          path: out/MetrolistPlus.apk
          retention-days: 7

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "Metrolist Plus compilado desde la rama \`ricardo\` (commit ${GITHUB_SHA::7})."
            echo
            echo "## Últimos cambios"
            git log -n 10 --format='* %s (%h)' 2>/dev/null || true
          } > notes.md

          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" out/MetrolistPlus.apk \
            --target "$GITHUB_SHA" \
            --title "Metrolist Plus" \
            --notes-file notes.md \
            --latest
