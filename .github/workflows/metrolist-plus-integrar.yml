# Integra en `ricardo` el trabajo que Claude sube desde la nube (celular, claude.ai/code) a ramas `claude/**`,
# y lanza la compilación normal de Metrolist Plus. Así Ricardo recibe una sola app que se actualiza encima.
# Archivo exclusivo del fork: el original no lo tiene, así que nunca choca al sincronizar.
#
# Límites a propósito:
# - Si el merge tiene conflictos, falla y no toca `ricardo`: Claude en la PC lo integra a mano.
# - GITHUB_TOKEN no puede subir cambios a `.github/workflows/`: esas ramas las integra Claude en la PC.

name: Metrolist Plus (integrar rama de Claude)

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write
  actions: write

concurrency:
  group: integrar-ricardo
  cancel-in-progress: false

jobs:
  integrar:
    name: Juntar con ricardo y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ricardo
          fetch-depth: 0

      - name: Merge into ricardo
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          antes=$(git rev-parse HEAD)
          git fetch origin "$GITHUB_REF_NAME"
          git merge --no-edit -m "Merge $GITHUB_REF_NAME into ricardo" FETCH_HEAD
          if [ "$(git rev-parse HEAD)" = "$antes" ]; then
            echo "Nada nuevo que integrar."
            exit 0
          fi
          git push origin ricardo
          # Igual que paths-ignore de metrolist-plus.yml: solo se compila si cambió algo de la app.
          if git diff --name-only "$antes" HEAD | grep -qvE '\.md$|^\.claude/|^herramientas/|^fastlane/|^assets/'; then
            echo "compilar=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push hecho con GITHUB_TOKEN no dispara otros workflows, así que la compilación se lanza explícitamente.
      - name: Build and publish
        if: steps.merge.outputs.compilar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run metrolist-plus.yml --ref ricardo
