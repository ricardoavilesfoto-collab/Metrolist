# Verificación de Metrolist Plus (fork de Ricardo): compila las ramas de trabajo de Claude
# sin publicar nada. El APK de prueba queda como artefacto del workflow.
# Archivo exclusivo del fork: el original no lo tiene, así que nunca choca al sincronizar.

name: Metrolist Plus (verificación)

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - "fastlane/**"
      - "assets/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # Llave fija de pruebas (secreto PLUS_DEBUG_KEYSTORE, PKCS12, alias androiddebugkey, contraseña android) para
      # que cada APK de prueba se instale encima del anterior. Sin el secreto se crea una llave nueva en cada
      # compilación y hay que desinstalar la app de prueba antes de instalar la siguiente.
      - name: Prepare test signing key
        env:
          PLUS_DEBUG_KEYSTORE: ${{ secrets.PLUS_DEBUG_KEYSTORE }}
        run: |
          key="$RUNNER_TEMP/prueba.keystore"
          if [ -n "$PLUS_DEBUG_KEYSTORE" ]; then
            echo "$PLUS_DEBUG_KEYSTORE" | base64 -d > "$key"
          else
            keytool -genkeypair -keystore "$key" -storetype PKCS12 -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Metrolist Plus Prueba"
          fi
          echo "METROLIST_DEBUG_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"

      # Otro applicationId: la prueba se instala junto a Metrolist Plus sin reemplazarla ni tocar sus datos.
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleFossDebug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.plus.prueba
          METROLIST_APP_NAME: Metrolist Plus Prueba

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MetrolistPlus-prueba
          path: app/build/outputs/apk/universalFoss/debug/*.apk
          retention-days: 7
