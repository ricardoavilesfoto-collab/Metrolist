# Verificación de Metrolist Plus (fork de Ricardo): compila las ramas de trabajo de Claude
# sin publicar nada. El APK de prueba queda como artefacto del workflow.
# Archivo exclusivo del fork: el original no lo tiene, así que nunca choca al sincronizar.

name: Metrolist Plus (verificación)

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - "fastlane/**"
      - "assets/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # app/build.gradle.kts firma el debug con ~/.android/debug.keystore, que no existe en el runner.
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleFossDebug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.plus
          METROLIST_APP_NAME: Metrolist Plus

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MetrolistPlus-prueba
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 7
